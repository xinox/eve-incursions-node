name: Sync EVE Incursions

on:
  workflow_dispatch:
  schedule:
    - cron: '5-59/5 * * * *'
    - cron: '0 * * * *'

jobs:
  sync-spawns:
    runs-on: ubuntu-latest
    steps:
      - name: Sync active spawns
        run: |
          curl --fail --show-error --silent --max-time 90 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL/api/cron/sync-spawns"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_URL: ${{ vars.SYNC_URL || 'https://eve-incursions-node-delta.vercel.app' }}

      - name: Sync hourly influence logs
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
        run: |
          curl --fail --show-error --silent --max-time 90 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL/api/cron/sync-influence"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_URL: ${{ vars.SYNC_URL || 'https://eve-incursions-node-delta.vercel.app' }}
